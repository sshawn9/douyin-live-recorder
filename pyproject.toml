[project]
name = "douyin-live-recorder"
version = "0.0.1"
description = "Headless Douyin live monitor and lossless stream recorder"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["httpx>=0.28.1", "m3u8>=6.0.0", "rich>=15.0.0", "typer>=0.16.0"]

[dependency-groups]
dev = ["pyright>=1.1.411", "ruff>=0.15.2"]

[project.scripts]
douyin-live-recorder = "douyin_live_recorder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/douyin_live_recorder"]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
